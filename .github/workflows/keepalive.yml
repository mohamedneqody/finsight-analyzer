name: FinSight keepalive
on:
  schedule:
    - cron: "*/25 * * * *"
  workflow_dispatch: {}
concurrency:
  group: finsight-keepalive
  cancel-in-progress: false
permissions: {}
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Keep codespace awake (self-heal if asleep)
        env:
          GH_TOKEN: ${{ secrets.CS_PAT }}
          CS_ENV: ${{ secrets.CS_ENV }}
        run: |
          if gh codespace ssh -c finsight-x5wpvq55w4q63vq55 -- "echo ok" 2>/dev/null; then
            echo "keepalive: codespace awake — connection resets idle timer"
          else
            echo "keepalive: codespace asleep — starting..."
            gh api -X POST user/codespaces/finsight-x5wpvq55w4q63vq55/start || true
            sleep 50
            printf '%s' "$CS_ENV" | gh codespace ssh -c finsight-x5wpvq55w4q63vq55 -- "cat > /workspaces/finsight-analyzer/.env && sed -i 's/\r\$//' /workspaces/finsight-analyzer/.env && chmod 600 /workspaces/finsight-analyzer/.env" || true
            gh codespace ssh -c finsight-x5wpvq55w4q63vq55 -- "bash /workspaces/finsight-analyzer/.cloud/start.sh"
          fi
