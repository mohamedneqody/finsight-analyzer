name: FinSight keepalive
on:
  # cron disabled 2026-11-19: (a) GitHub scheduled runs fired 1/29 in 12h,
  # (b) keeping the codespace awake 24/7 burns its ~60h/month free compute
  # quota in ~3 days -> mid-month death. Codespace is NOT a 24/7 host.
  # Keep for MANUAL wake+heal (also used by تشغيل_السحابة.bat indirectly).
  # schedule:
  #   - cron: "*/25 * * * *"
  workflow_dispatch: {}
concurrency:
  group: finsight-keepalive
  cancel-in-progress: false
permissions: {}
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake codespace + restore env + start services
        env:
          GH_TOKEN: ${{ secrets.CS_PAT }}
          CS_ENV: ${{ secrets.CS_ENV }}
        run: |
          if gh codespace ssh -c finsight-q7q4pg77qwg9247rw -- "echo ok" 2>/dev/null; then
            echo "codespace awake — ensuring services"
            gh codespace ssh -c finsight-q7q4pg77qwg9247rw -- "bash /workspaces/finsight-analyzer/.cloud/start.sh"
          else
            echo "codespace asleep — starting..."
            gh api -X POST user/codespaces/finsight-q7q4pg77qwg9247rw/start || true
            sleep 50
            printf '%s' "$CS_ENV" | gh codespace ssh -c finsight-q7q4pg77qwg9247rw -- "cat > /workspaces/finsight-analyzer/.env && sed -i 's/\r\$//' /workspaces/finsight-analyzer/.env && chmod 600 /workspaces/finsight-analyzer/.env" || true
            gh codespace ssh -c finsight-q7q4pg77qwg9247rw -- "bash /workspaces/finsight-analyzer/.cloud/start.sh"
          fi
